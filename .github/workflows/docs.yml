name: docs

# VitePress 利用ガイド（docs/）を GitHub Pages へ自動デプロイする。
# main への push で docs/ 配下が変わったときにビルドし、actions/deploy-pages で公開する。
#
# ⚠️ 重要（社外秘・公開範囲）:
#   本サイトは社外秘情報を含む利用ガイド。標準プランの GitHub では private repo の
#   Pages も URL を知っていれば閲覧可能（公開）になる。アクセス制御をかけられるのは
#   GitHub Enterprise Cloud で「Pages の公開範囲を private/組織内に限定」した構成のみ。
#   公開前に必ずリポジトリ Settings → Pages の公開範囲を精査すること（docs/tasks.md 参照）。
#   公開不可と判断したら、本ワークフローを無効化（このファイルを削除 or on を空に）する。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Settings → Pages のソースを "GitHub Actions" にしたうえで、手動再デプロイも可能にする。
  workflow_dispatch:

# GITHUB_TOKEN に Pages デプロイ用の最小権限を付与する。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は直列化し、進行中のデプロイは中断せず完了させる（公開済みを巻き戻さない）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build with VitePress
        run: npm run docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
