name: secret-scan

# Git 層の機密漏洩防止。PR とデフォルトブランチへの push で gitleaks を実行し、
# .gitleaks.toml のルール（マイナンバー / クレジットカード / メールアドレス一括 /
# パスワードリテラル / 機密ラベル / 社内ドメイン + 標準 API キーパターン）に
# 合致するシークレットがあれば fail させる。
#
# 実装メモ:
#   ラッパーの gitleaks/gitleaks-action は Organization 配下のリポジトリでは
#   有料ライセンス（GITLEAKS_LICENSE）が必須になった。本リポジトリ（belta-group org）
#   ではこれを避けるため、ライセンス不要な gitleaks 本体（OSS・MIT ライセンス）を
#   公式 Docker イメージで直接実行する。git 履歴（PR の全コミット）を走査し、
#   検出があれば gitleaks の既定どおり exit 1 で CI を fail させる。
#   ※ イメージは :latest を使用（再現性を固定したい場合は :vX.Y.Z にピン留めする）。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # CLI 直実行のため PR への書き込み権限は不要

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PR の全コミットを走査するため履歴を全取得する。
          fetch-depth: 0
      - name: gitleaks scan (CLI / license-free)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            --entrypoint sh \
            ghcr.io/gitleaks/gitleaks:latest \
            -c 'git config --global --add safe.directory /repo && gitleaks git --no-banner --redact --verbose --config=.gitleaks.toml .'
