name: secret-scan

# Git 層の機密漏洩防止。PR とデフォルトブランチへの push で gitleaks を実行し、
# .gitleaks.toml のルール（マイナンバー / クレジットカード / メールアドレス一括 /
# パスワードリテラル / 機密ラベル / 社内ドメイン + 標準 API キーパターン）に
# 合致するシークレットがあれば fail させる。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # gitleaks-action が PR にサマリを書き込むため

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # PR の全コミットを走査するため履歴を全取得する。
          fetch-depth: 0
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action v2 は Organization 配下のリポジトリでは無償ライセンス
          # キーの登録が必要。belta-group org のため Secrets に GITLEAKS_LICENSE を
          # 登録しておくこと（個人アカウントのリポジトリでは不要）。
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
