# ─────────────────────────────────────────────────────────────────────────────
# Belta workflow agent — gitleaks 設定（Git 層の機密漏洩防止）
#
# 役割: コミット／PR に混入したマイナンバー・クレジットカード・メールアドレス
#       一括・パスワードリテラル・機密ラベル・社内ドメインを CI で検出して fail
#       させる「最後の砦」。実行時の外部送信は hooks/pre-tool-use.js（PreToolUse）
#       が、Git 層は本ファイル + .github/workflows/secret-scan.yml が担当する。
#
# エンジン制約: gitleaks は Go の RE2 を使うため lookahead/lookbehind 非対応。
#       フック（Node.js）で使う (?<!\d) 等は使えないので、語境界 \b で等価な
#       挙動（16 桁 CC と 12 桁マイナンバーの二重検出回避など）を実現している。
#
# 標準 API キーパターン継承: [extend] useDefault = true で gitleaks 同梱の
#       既定ルール（AWS / GCP / Slack token / Generic API Key 等）を取り込む。
# ─────────────────────────────────────────────────────────────────────────────

title = "Belta workflow agent gitleaks config"

[extend]
# gitleaks 既定ルール（標準 API キーパターン）を継承したうえで以下を追加する。
useDefault = true

# ── マイナンバー（12 桁。4-4-4、区切りは任意） ────────────────────────────────
# 区切り無しの 16 桁連続数字（クレジットカード）は \b 境界で除外される。
# 区切り（スペース/ハイフン）付き 16 桁 CC は先頭 12 桁が本ルールにも重複ヒット
# し得るが、その行は belta-credit-card が独立検出するため CI は必ず fail する
# （RE2 は lookahead 非対応のためフックの (?![ -]?\d) 相当は書けない。重複は
# 無害で、正規データへの新たな誤検知ではない）。
[[rules]]
id = "belta-my-number"
description = "マイナンバー（12 桁）"
regex = '''\b\d{4}[- ]?\d{4}[- ]?\d{4}\b'''

# ── クレジットカード（16 桁。4 桁 ×4、区切りは任意） ──────────────────────────
# RE2 では Luhn 検証ができないため Git 層は桁構造のみで検出する
# （Luhn による誤検知抑制は実行時フック pre-tool-use.js が担当）。
[[rules]]
id = "belta-credit-card"
description = "クレジットカード番号（16 桁）"
regex = '''\b(?:\d{4}[- ]?){3}\d{4}\b'''

# ── メールアドレス一括（5 件以上が区切り文字で連続） ──────────────────────────
# 散文中の単発アドレスは拾わず、エクスポートされた宛先リスト等
# （5 件以上が空白／改行／カンマ／セミコロンで連続）のみを検出する。
# フックの「ユニーク 5 件以上」に対応する Git 層での近似。
[[rules]]
id = "belta-email-bulk"
description = "メールアドレス一括（5 件以上の連続）"
regex = '''(?:[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}[\s,;]+){4,}[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
keywords = ["@"]

# ── 社内ドメイン @belta.co.jp ────────────────────────────────────────────────
# 社内メールアドレス（= 従業員 PII）の単発混入を検出する。
[[rules]]
id = "belta-internal-domain"
description = "社内ドメイン宛メールアドレス（@belta.co.jp）"
regex = '''[A-Za-z0-9._%+-]+@belta\.co\.jp'''
keywords = ["belta.co.jp"]
  [rules.allowlist]
  description = "オンボーディングの初期値として提示する bot アドレスは除外"
  regexTarget = "match"
  regexes = ['''system-bot@belta\.co\.jp''']

# ── パスワードリテラル ────────────────────────────────────────────────────────
# password / passwd / pwd の代入で、引用符付きの値を持つもののみ検出する。
# 引用符を必須にすることで `password: string` 等の型注釈の誤検知を避ける。
[[rules]]
id = "belta-password-literal"
description = "パスワードリテラル（password/passwd/pwd の代入）"
regex = '''(?i)(?:password|passwd|pwd)["']?\s*[:=]\s*['"][^'"\n]{3,}['"]'''
keywords = ["password", "passwd", "pwd"]

# ── 機密ラベル（マル秘 / ㊙ / 社外秘 / Confidential） ─────────────────────────
# 本プラグインは「情報の機密度分類（公開／社外秘／極秘）」自体が主題のため、
# ソース・ドキュメント・スキル定義に「社外秘 / Confidential」が語彙として
# 頻出する。これらは実データ（漏洩物）ではないため、プラグイン本体ツリー
# （plugins/ ・ docs/ ・ README.md）を本ルールに限り除外する。除外外のパス
# （例: 誤って repo に置かれたエクスポート文書）では引き続き検出する。
[[rules]]
id = "belta-confidential-label"
description = "機密ラベル（マル秘 / ㊙ / 社外秘 / Confidential）"
regex = '''(?i)(マル秘|㊙|社外秘|Confidential)'''
keywords = ["マル秘", "㊙", "社外秘", "confidential"]
  [rules.allowlist]
  description = "プラグイン本体ツリー（機密度分類が主題で、ラベルは語彙であり実データではない）"
  paths = ['''^plugins/''', '''^docs/''', '''^README\.md$''']

# ── 個人名（氏名フィールド／PII テーブル列） ─────────────────────────────────
# 「名前そのもの」を正規表現で弾くのは不可能（日本語の人名に構造が無く、
# `仕様`・`様式`・`同様`・担当者名 `内田氏` 等の通常語まで巻き込むため）。
# 代わりに、実害のある漏洩経路 ——「氏名 / 名前 / フルネームというラベルに実値が
# 付いた構造」と「氏名列が他の PII 列に隣接する CSV ヘッダ」—— のみを高精度で
# 検出する。プロフィールは ~/.belta/（gitignore 済み）に保存されコミットされず、
# テンプレートは `owner_name: <氏名>` のプレースホルダのため誤検知しない。
# 散文中の人名（「田中さんに確認」等）は意図的に対象外（誤検知回避）。
[[rules]]
id = "belta-personal-name"
description = "個人名（氏名/名前/フルネーム = 実値、または氏名列の CSV ヘッダ）"
regex = '''(?i)(?:(?:氏名|名前|フルネーム|full[ _]?name)[ 　]*[:：=][ 　]*['"「]?[^\s'"<，、|\]][^\s'"，、|\]]+|(?:氏名|名前)[、,][ 　]*(?:住所|電話|年齢|生年月日|メールアドレス|メール|社員番号|性別|役職))'''
keywords = ["氏名", "名前", "フルネーム", "full"]

# ── グローバル allowlist ─────────────────────────────────────────────────────
# 本設定ファイル自身は全ルールのキーワード・正規表現（社外秘 / Confidential /
# password / @belta.co.jp / 数字パターン）を正規に含むため、全ルールから除外する。
# 他のプラグインソースは個別除外せず、実シークレットの混入は引き続き検出する
# （機密ラベルだけは上記のルール単位 allowlist でツリー除外）。
[allowlist]
description = "gitleaks 設定ファイル自身（全ルールのパターンを正規に含む）"
paths = ['''(^|/)\.gitleaks\.toml$''']
